---
- name: Configure the Debian lab VM
  hosts: local
  become: true

  tasks:
    - name: Update the package list
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install asciinema
      ansible.builtin.apt:
        name: asciinema
        state: present

    - name: Install Apache
      ansible.builtin.apt:
        name: apache2
        state: present

    - name: Start Apache and enable it at boot
      ansible.builtin.service:
        name: apache2
        state: started
        enabled: true

    - name: Show completion message
      ansible.builtin.debug:
        msg: "Liam's Lab6 setup is complete! Apache is ready at http://localhost."
