name: C/C++ CI Lab 4

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build
      run: make
      working-directory: ./lab4/lab3/590MakefileLab

    - name: Run tests
      run: make test
      working-directory: ./lab4/lab3/590MakefileLab

    - name: Run tests to verify correct output
      working-directory: ./lab4/lab3/590MakefileLab
      run: |
        # run tests to verify fibonacci output and golden ratio
        OUTPUT=$(./fibonacci)
        echo "$OUTPUT"
        echo "$OUTPUT" | grep -qw "55"
        echo "$OUTPUT" | grep -q "1.618034"

